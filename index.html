<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미스틱 해처리: 32개의 영혼</title>
  <meta name="description" content="5가지의 신비로운 선택을 통해 신비한 알의 운명을 정하고 32가지 독특한 생명체들을 부화시켜 도감을 완성하세요.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient backdrop overlay -->
  <div class="bg-overlay"></div>
  
  <!-- Particle effect system canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Mute Controller (Floating) -->
  <button id="sound-btn" class="btn sound-toggle" aria-label="음소거 토글">
    <!-- Unmuted icon by default -->
    <svg id="sound-icon-on" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5l-4.5-4.5H4v-2h2.5L11 6.5v11zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
    </svg>
    <!-- Muted icon (hidden initially) -->
    <svg id="sound-icon-off" viewBox="0 0 24 24" style="display: none;">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15.5l-4.5-4.5H4v-2h2.5L11 6.5v11zM19 12c0-1.3-.34-2.5-1-3.5L16.5 10c.3.6.5 1.3.5 2s-.2 1.4-.5 2l1.5 1.5c.6-1 1-2.2 1-3.5zm-5-5.5v2.2l-2.2-2.2L14 6.5z"/>
    </svg>
  </button>

  <!-- Bestiary Controller (Floating) -->
  <button id="bestiary-btn" class="btn bestiary-toggle">
    📖 부화 기록지 (<span id="bestiary-count-nav">0/32</span>)
  </button>

  <main id="app">
    
    <!-- 1. MAIN MENU SCREEN -->
    <section id="menu-screen" class="glass-panel active">
      <h1>미스틱 해처리</h1>
      <p class="tagline">우주의 알을 배양하세요. 그 핵심을 조각하세요.</p>
      
      <div class="menu-egg-holder">
        <div class="egg-container">
          <div class="egg"></div>
        </div>
      </div>
      
      <button id="start-btn" class="btn btn-primary">배양 시작하기</button>
    </section>

    <!-- 2. INCUBATION SCREEN (SPLIT LAYOUT) -->
    <section id="incubation-screen" class="glass-panel">
      <!-- Left side: The Egg -->
      <div class="incubation-left">
        <div class="egg-container id-egg-container" id="game-egg-container">
          <div class="egg"></div>
          <div class="egg-cracks">
            <svg viewBox="0 0 100 133">
              <!-- Vector Cracks -->
              <path class="crack-path crack-1" d="M 40 15 Q 30 45 45 60 T 25 85" />
              <path class="crack-path crack-2" d="M 65 115 Q 75 90 60 70 T 80 45" />
              <path class="crack-path crack-3" d="M 20 60 Q 35 65 30 80 T 45 105" />
              <path class="crack-path crack-4" d="M 75 30 Q 60 50 70 70 T 55 95" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Right side: Selection Panels -->
      <div class="incubation-right">
        <div>
          <div class="question-title" id="q-title">배양실 환경설정</div>
          <h2 class="question-text" id="q-text">온도를 설정하는 중...</h2>
          
          <div class="choices-container" id="choices-box">
            <!-- Dynamic Choice Cards -->
            <button class="choice-card" data-val="0">
              <span class="choice-label">선택지 A</span>
              <span class="choice-desc">선택지에 대한 설명</span>
            </button>
            <button class="choice-card" data-val="1">
              <span class="choice-label">선택지 B</span>
              <span class="choice-desc">선택지에 대한 설명</span>
            </button>
          </div>
        </div>

        <div class="progress-nav">
          <button id="back-btn" class="btn btn-text">← 이전으로</button>
          <div class="indicators" id="indicators-container">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 3. HATCH SCREEN -->
    <section id="hatch-screen" class="glass-panel">
      <h2>새로운 생명체 부화!</h2>
      <div class="hatch-card">
        <span class="hatch-emoji" id="h-emoji">🐣</span>
        <h3 class="hatch-name" id="h-name">생명체 이름</h3>
        <div class="hatch-badges">
          <span class="badge badge-rarity" id="h-rarity">일반</span>
          <span class="badge" id="h-element" style="background: rgba(255,255,255,0.05);">속성</span>
        </div>
        <p class="hatch-lore" id="h-lore">알이 깨지며 우주적 불꽃과 함께 새로운 생명이 깨어납니다...</p>
      </div>
      <div class="hatch-actions">
        <button id="restart-btn" class="btn btn-primary">다시 부화하기</button>
        <button id="share-btn" class="btn">발견 공유하기</button>
      </div>
    </section>

    <!-- 4. BESTIARY GRID OVERLAY -->
    <section id="bestiary-screen" class="glass-panel">
      <div class="bestiary-header">
        <h2>부화 기록지</h2>
        <span class="bestiary-stats" id="bestiary-stats-count">도감 달성률: 0/32</span>
      </div>
      
      <div class="bestiary-grid" id="bestiary-grid-container">
        <!-- Rendered dynamically -->
      </div>
      
      <div class="bestiary-footer">
        <button id="reset-bestiary-btn" class="btn btn-text" style="margin-right: auto; color: #e74c3c;">기록 초기화</button>
        <button id="close-bestiary-btn" class="btn">돌아가기</button>
      </div>
    </section>

    <!-- 5. BESTIARY INSPECTOR MODAL -->
    <div id="inspector-modal" class="bestiary-inspector">
      <div class="glass-panel inspector-card">
        <span class="hatch-emoji" id="ins-emoji">🐣</span>
        <h3 class="hatch-name" id="ins-name">생명체 이름</h3>
        <div class="hatch-badges">
          <span class="badge badge-rarity" id="ins-rarity">일반</span>
          <span class="badge" id="ins-element">속성</span>
        </div>
        <p class="hatch-lore" id="ins-lore">속성 설명...</p>
        <button id="close-inspector-btn" class="btn" style="margin-top: 20px; width: 100%;">닫기</button>
      </div>
    </div>

  </main>

  <!-- Core JavaScript code modules -->
  <script type="module" src="app.js"></script>
</body>
</html>
